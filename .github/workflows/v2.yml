name: Build Ice Emulator Launcher v4 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack v4 Project (Top Bar + Local Profile + Trophies + Custom Logo)
        run: |
          python3 - << 'PYEOF'
          import os, shutil, json, lzma, base64
          if os.path.exists("app"): shutil.rmtree("app")
          data = json.loads(lzma.decompress(base64.b64decode("")).decode("utf-8"))
          logo = data.pop("LOGO_B64")
          for path, content in data.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "w", encoding="utf-8").write(content)
          os.makedirs("app/src/main/res/drawable-nodpi", exist_ok=True)
          open("app/src/main/res/drawable-nodpi/app_logo.webp", "wb").write(base64.b64decode(logo))
          print("Unpacked v4 files:", list(data.keys()))
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: IceEmulatorLauncher-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
