name: Build Ice Emulator Launcher v4 APK
on: [push, workflow_dispatch]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack v4 Project from Git History
        run: |
          python3 - << 'PYEOF'
          import os, re, json, lzma, base64, shutil, subprocess
          try:
              raw = subprocess.check_output(["git", "show", "5f7d344:.github/workflows/v2.yml"], text=True)
          except Exception:
              raw = subprocess.check_output(["git", "log", "-p", "--all", "-n", "15"], text=True)
          m = re.search(r'(/Td6WFoAAATm1rRGAgAhARwAAAAQz1jM4[A-Za-z0-9+/=\s]+?)["\']', raw)
          if not m:
              raise RuntimeError("Could not find v4 payload in commit 5f7d344")
          b64 = re.sub(r'\s+', '', m.group(1))
          if os.path.exists("app"):
              shutil.rmtree("app")
          data = json.loads(lzma.decompress(base64.b64decode(b64)).decode("utf-8"))
          logo = data.pop("LOGO_B64")
          for path, content in data.items():
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "w", encoding="utf-8").write(content)
          os.makedirs("app/src/main/res/drawable-nodpi", exist_ok=True)
          open("app/src/main/res/drawable-nodpi/app_logo.webp", "wb").write(base64.b64decode(logo))
          print("Unpacked v4 files successfully:", list(data.keys()))
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceEmulatorLauncher-v4-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
